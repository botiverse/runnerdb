version: 1
frontend:
  phases:
    build:
      commands:
        - node --version
        - node build.mjs
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
customHeaders:
  - pattern: '*.json'
    headers:
      - key: Content-Type
        value: application/json; charset=utf-8
      - key: Access-Control-Allow-Origin
        value: '*'
      - key: Cache-Control
        value: public, max-age=300
